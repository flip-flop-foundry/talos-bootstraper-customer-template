name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container:
        image: ghcr.io/catthehacker/ubuntu:act-latest
        volumes:
            - /etc/ssl/certs:/host-ssl-certs:ro
    steps:
      - name: 🔒 Install custom CA certificate
        run: |
          if [ ! -f /host-ssl-certs/cluster-ca.crt ]; then
            echo "ERROR: Missing CA certificate: /host-ssl-certs/cluster-ca.crt"
            echo "Expected source file on runner host: /etc/ssl/certs/cluster-ca.crt"
            echo "This workflow mounts host /etc/ssl/certs -> container /host-ssl-certs (read-only)."
            exit 1
          fi
          cp /host-ssl-certs/cluster-ca.crt /usr/local/share/ca-certificates/cluster-ca.crt
          update-ca-certificates

      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Build and push the Docker image to the Gitea container registry.
      # CI_REGISTRY_TOKEN / CI_REGISTRY_USER are org-level secrets set by
      # bootstrap-customer.sh (ci-{org} service user, write:package scope).
      # -----------------------------------------------------------------------
      - name: Log in to Gitea container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_DOMAIN }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE="${{ vars.REGISTRY_DOMAIN }}/${{ vars.CUSTOMER_ORG }}/${{ vars.APP_NAME }}"
          docker build \
            --build-arg APP_VERSION="${{ gitea.sha }}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${{ gitea.sha }}" \
            .

      - name: Push Docker image
        run: |
          IMAGE="${{ vars.REGISTRY_DOMAIN }}/${{ vars.CUSTOMER_ORG }}/${{ vars.APP_NAME }}"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ gitea.sha }}"

      # -----------------------------------------------------------------------
      # Trigger a rolling restart of the Deployment so Kubernetes pulls the
      # freshly pushed :latest image.
      #
      # KUBE_SA_TOKEN, KUBERNETES_SERVICE_HOST, and KUBERNETES_SERVICE_PORT are
      # injected into the job container's environment by the runner's saveEnvs
      # initContainer — they come from the runner pod's mounted service account
      # token (gitea-runner-service-account).
      #
      # The runner SA has a RoleBinding in the customer namespace (created by
      # bootstrap-customer.sh) that grants it permission to patch Deployments.
      # -----------------------------------------------------------------------
      - name: Install kubectl
        run: |
          KUBECTL_VERSION=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
          curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
            -o /usr/local/bin/kubectl
          chmod +x /usr/local/bin/kubectl

      - name: Rollout restart Deployment
        run: |
          kubectl \
            --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}" \
            --token="${KUBE_SA_TOKEN}" \
            --insecure-skip-tls-verify \
            -n "${{ vars.NAMESPACE }}" \
            rollout restart deployment/${{ vars.APP_NAME }}

      - name: Wait for rollout to complete
        run: |
          kubectl \
            --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}" \
            --token="${KUBE_SA_TOKEN}" \
            --insecure-skip-tls-verify \
            -n "${{ vars.NAMESPACE }}" \
            rollout status deployment/${{ vars.APP_NAME }} \
            --timeout=120s
